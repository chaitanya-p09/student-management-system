<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Edit Student</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

    <!-- Navigation Bar -->
    <nav class="navbar">
        <div class="navbar-container">

            <a href="/dashboard" class="logo">
                🎓 StudentMS
            </a>

            <div class="nav-links">
                <a href="/dashboard">Home</a>
                <a href="/students">Students</a>
                <a href="/add-student">Add Student</a>
                <a href="/attendance">Attendance</a>
                <a href="/academic">Academic</a>
                <a href="/logout" class="logout-link">Logout</a>
            </div>

        </div>
    </nav>


    <!-- Edit Student Section -->
    <main class="form-page">

        <div class="form-header">
            <h1>✏️ Edit Student</h1>
            <p>Update the student's information below.</p>
        </div>


        <div class="student-form-card">

            <form method="POST">

                <!-- Student Name -->
                <div class="form-group">
                    <label for="name">Student Name</label>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        value="{{ student.name }}"
                        placeholder="Enter student name"
                        required
                    >
                </div>


                <!-- Email -->
                <div class="form-group">
                    <label for="email">Email Address</label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        value="{{ student.email }}"
                        placeholder="Enter email address"
                        required
                    >
                </div>


                <!-- Course -->
                <div class="form-group">
                    <label for="course">Course</label>

                    <input
                        type="text"
                        id="course"
                        name="course"
                        value="{{ student.course }}"
                        placeholder="Enter course"
                        required
                    >
                </div>


                <!-- Year -->
                <div class="form-group">
                    <label for="year">Year</label>

                    <select id="year" name="year" required>

                        <option value="1"
                            {% if student.year|string == "1" %}selected{% endif %}>
                            1st Year
                        </option>

                        <option value="2"
                            {% if student.year|string == "2" %}selected{% endif %}>
                            2nd Year
                        </option>

                        <option value="3"
                            {% if student.year|string == "3" %}selected{% endif %}>
                            3rd Year
                        </option>

                        <option value="4"
                            {% if student.year|string == "4" %}selected{% endif %}>
                            4th Year
                        </option>

                    </select>

                </div>


                <!-- Buttons -->
                <div class="form-buttons">

                    <button type="submit" class="submit-btn">
                        ✓ Update Student
                    </button>

                    <a href="/students" class="cancel-btn">
                        Cancel
                    </a>

                </div>

            </form>

        </div>


        <div class="back-section">

            <a href="/students" class="back-btn">
                ← Back to Students
            </a>

        </div>

    </main>


    <!-- Footer -->
    <footer>
        <p>© 2026 Student Management System</p>
    </footer>

</body>

</html>
