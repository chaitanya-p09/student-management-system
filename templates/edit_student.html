<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Edit Student</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

    <div class="form-container">

        <h1>Edit Student</h1>

        <form method="POST">

            <input
                type="text"
                name="name"
                value="{{ student.name }}"
                required
            >

            <input
                type="email"
                name="email"
                value="{{ student.email }}"
                required
            >

            <input
                type="text"
                name="course"
                value="{{ student.course }}"
                required
            >

            <input
                type="text"
                name="year"
                value="{{ student.year }}"
                required
            >

            <button type="submit">
                Update Student
            </button>

        </form>

        <br>

        <a href="/students">
            ← Back to Students
        </a>

    </div>

</body>

</html>
