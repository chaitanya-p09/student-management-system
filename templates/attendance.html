<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Attendance Management</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

    <!-- Navigation Bar -->
    <nav class="navbar">
        <div class="navbar-container">

            <a href="/dashboard" class="logo">
                🎓 StudentMS
            </a>

            <div class="nav-links">
                <a href="/dashboard">Home</a>
                <a href="/students">Students</a>
                <a href="/add-student">Add Student</a>
                <a href="/attendance">Attendance</a>
                <a href="/academic">Academic</a>
                <a href="/logout" class="logout-link">Logout</a>
            </div>

        </div>
    </nav>


    <!-- Attendance Page -->
    <main class="attendance-page">

        <div class="attendance-header">
            <h1>📅 Attendance Management</h1>
            <p>Mark and manage student attendance.</p>
        </div>


        <!-- Attendance Form Card -->
        <div class="attendance-card">

            <form method="POST">

                <!-- Student -->
                <div class="attendance-form-group">

                    <label for="student_id">
                        Select Student
                    </label>

                    <select
                        name="student_id"
                        id="student_id"
                        required
                    >

                        <option value="">
                            -- Select Student --
                        </option>

                        {% for student in students %}

                        <option value="{{ student.id }}">
                            {{ student.name }} - {{ student.course }}
                        </option>

                        {% endfor %}

                    </select>

                </div>


                <!-- Date -->
                <div class="attendance-form-group">

                    <label for="date">
                        Date
                    </label>

                    <input
                        type="date"
                        name="date"
                        id="date"
                        required
                    >

                </div>


                <!-- Status -->
                <div class="attendance-form-group">

                    <label for="status">
                        Attendance Status
                    </label>

                    <select
                        name="status"
                        id="status"
                        required
                    >

                        <option value="">
                            -- Select Status --
                        </option>

                        <option value="Present">
                            ✓ Present
                        </option>

                        <option value="Absent">
                            ✕ Absent
                        </option>

                    </select>

                </div>


                <!-- Submit -->
                <div class="attendance-buttons">

                    <button
                        type="submit"
                        class="submit-btn"
                    >
                        ✓ Save Attendance
                    </button>

                    <a
                        href="/dashboard"
                        class="cancel-btn"
                    >
                        Cancel
                    </a>

                </div>

            </form>

        </div>


        <!-- Attendance Records Link -->
        <div class="attendance-records-link">

            <a href="/attendance-records" class="records-btn">
                📋 View Attendance Records
            </a>

        </div>


        <!-- Back -->
        <div class="details-back-section">

            <a href="/dashboard" class="back-btn">
                ← Back to Dashboard
            </a>

        </div>

    </main>


    <!-- Footer -->
    <footer>
        <p>© 2026 Student Management System</p>
    </footer>

</body>

</html>
