<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Academic Record - StudentMS</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

    <!-- Navigation -->
    <nav class="navbar">

        <div class="navbar-container">

            <a href="/dashboard" class="logo">
                🎓 StudentMS
            </a>

            <div class="nav-links">
                <a href="/dashboard">Dashboard</a>
                <a href="/students">Students</a>
                <a href="/add-student">Add Student</a>
                <a href="/attendance">Attendance</a>
                <a href="/academic">Academic</a>
                <a href="/logout" class="logout-link">Logout</a>
            </div>

        </div>

    </nav>


    <!-- Academic Page -->
    <main class="form-page academic-page">

        <div class="form-header">

            <h1>📚 Add Academic Record</h1>

            <p>
                Add student marks and academic results
            </p>

        </div>


        <div class="student-form-card">

            <form method="POST">

                <!-- Student -->
                <div class="form-group">

                    <label for="student_id">
                        Select Student
                    </label>

                    <select
                        name="student_id"
                        id="student_id"
                        required
                    >

                        <option value="">
                            -- Select Student --
                        </option>

                        {% for student in students %}

                        <option value="{{ student.id }}">
                            {{ student.name }} - {{ student.course }}
                        </option>

                        {% endfor %}

                    </select>

                </div>


                <!-- Subject -->
                <div class="form-group">

                    <label for="subject">
                        Subject
                    </label>

                    <input
                        type="text"
                        name="subject"
                        id="subject"
                        placeholder="Enter subject name"
                        required
                    >

                </div>


                <!-- Marks -->
                <div class="form-group">

                    <label for="marks">
                        Marks
                    </label>

                    <input
                        type="number"
                        name="marks"
                        id="marks"
                        placeholder="Enter marks (0 - 100)"
                        min="0"
                        max="100"
                        step="0.01"
                        required
                    >

                    <small class="form-help">
                        Enter marks between 0 and 100.
                    </small>

                </div>


                <!-- Buttons -->
                <div class="form-buttons">

                    <button
                        type="submit"
                        class="primary-btn"
                    >
                        💾 Save Academic Record
                    </button>

                    <a
                        href="/dashboard"
                        class="cancel-btn"
                    >
                        Cancel
                    </a>

                </div>

            </form>

        </div>


        <!-- Back -->
        <div class="back-section">

            <a href="/dashboard" class="back-btn">
                ← Back to Dashboard
            </a>

        </div>

    </main>


    <!-- Footer -->
    <footer class="footer">

        <p>
            © 2026 StudentMS. Student Management System.
        </p>

    </footer>

</body>

</html>
