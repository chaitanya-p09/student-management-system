<!DOCTYPE html>
<html>
<head>
    <title>Add Student</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

    <div class="dashboard">

        <h1>Add Student</h1>

        <form method="POST">

            <label>Student Name</label>
            <input
    type="text"
    name="name"
    required
>

            <br><br>

            <label>Email</label>
            <input
    type="email"
    name="email"
    required
>
            <br><br>

            <label>Course</label>
            <input
    type="text"
    name="course"
    required
>

            <br><br>

            <label>Year</label>
            <input
    type="text"
    name="year"
    required
>

            <br><br>

            <button type="submit">Add Student</button>

        </form>

        <br>

        <a href="/dashboard">Back to Dashboard</a>

    </div>

</body>
</html>
