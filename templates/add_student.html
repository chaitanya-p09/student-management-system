<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Add Student | StudentMS</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

    <!-- ================= NAVBAR ================= -->

    <nav class="navbar">

        <div class="navbar-container">

            <a href="/dashboard" class="logo">
                🎓 StudentMS
            </a>

            <div class="nav-links">

                <a href="/dashboard">Dashboard</a>
                <a href="/students">Students</a>
                <a href="/add-student">Add Student</a>
                <a href="/attendance">Attendance</a>
                <a href="/academic">Academic</a>
                <a href="/logout" class="logout-link">Logout</a>

            </div>

        </div>

    </nav>


    <!-- ================= ADD STUDENT ================= -->

    <main class="form-page">

        <div class="form-header">

            <h1>Add New Student</h1>

            <p>
                Enter the student's information below
            </p>

        </div>


        <div class="student-form-card">

            <form method="POST">

                <!-- Student Name -->

                <div class="form-group">

                    <label for="name">
                        Student Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="Enter student name"
                        required
                    >

                </div>


                <!-- Email -->

                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="student@example.com"
                        required
                    >

                </div>


                <!-- Course -->

                <div class="form-group">

                    <label for="course">
                        Course
                    </label>

                    <input
                        type="text"
                        id="course"
                        name="course"
                        placeholder="Example: B.Tech"
                        required
                    >

                </div>


                <!-- Year -->

                <div class="form-group">

                    <label for="year">
                        Year
                    </label>

                    <select
                        id="year"
                        name="year"
                        required
                    >

                        <option value="">
                            Select Year
                        </option>

                        <option value="1">
                            1st Year
                        </option>

                        <option value="2">
                            2nd Year
                        </option>

                        <option value="3">
                            3rd Year
                        </option>

                        <option value="4">
                            4th Year
                        </option>

                    </select>

                </div>


                <!-- Buttons -->

                <div class="form-buttons">

                    <button type="submit" class="primary-btn">
                        ➕ Add Student
                    </button>

                    <a href="/students" class="cancel-btn">
                        Cancel
                    </a>

                </div>

            </form>

        </div>


        <div class="back-section">

            <a href="/dashboard" class="back-btn">
                ← Back to Dashboard
            </a>

        </div>

    </main>


    <!-- ================= FOOTER ================= -->

    <footer class="footer">

        <p>
            © 2026 Student Management System
        </p>

    </footer>

</body>

</html>
